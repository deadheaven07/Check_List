<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Glow & Soft Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.28" />
    </filter>
    
    <!-- Squircle Frame Gradient -->
    <linearGradient id="squircleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Squircle Inner Luminous Background -->
    <linearGradient id="innerBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Checkmark Dynamic Gradient -->
    <linearGradient id="checkGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="35%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow Base -->
  <rect x="76" y="76" width="360" height="360" rx="96" fill="#ffffff" filter="url(#softGlow)" />

  <!-- Outer Gradient Squircle Border -->
  <rect x="76" y="76" width="360" height="360" rx="96" fill="url(#innerBgGradient)" stroke="url(#squircleGradient)" stroke-width="28" />

  <!-- Dynamic Fluid Checkmark -->
  <path d="M 170 252 
           C 182 238, 204 242, 216 260 
           L 246 306 
           C 254 318, 270 318, 278 306 
           L 382 144 
           C 394 126, 420 128, 428 148 
           C 434 162, 426 178, 412 198 
           L 282 376 
           C 268 396, 240 398, 222 380 
           L 156 308 
           C 142 292, 146 270, 170 252 Z" 
        fill="url(#checkGradient)" />
</svg>
